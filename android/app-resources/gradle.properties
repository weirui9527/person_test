# Static Gradle build settings for the Android package.
#
# androiddeployqt copies this file over the Qt template (files under
# QT_ANDROID_PACKAGE_SOURCE_DIR override matching template files) and then
# appends the dynamic properties it manages (androidCompileSdkVersion,
# androidBuildToolsVersion, androidNdkVersion, qtAndroidDir, qtMinSdkVersion,
# qtTargetSdkVersion, qtTargetAbiList, ...). Keep ONLY static settings here.

# The app depends on AndroidX (androidx.core + ML Kit digital-ink). Qt 6.4.3's
# androiddeployqt does NOT inject this flag (newer Qt does), so AGP aborts the
# build without it. Enabling AndroidX is mandatory for this dependency set.
android.useAndroidX=true
android.enableJetifier=true

# JVM args for the Gradle daemon (Java compilation of the Qt bindings + app sources).
org.gradle.jvmargs=-Xmx2500m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
